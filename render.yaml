services:
  # Karna backend on Render — runs the full Hono API natively against remote D1/R2.
  #
  # NOTE: this is a `web` service (public URL + inbound HTTP) so the Telegram
  # Bot API can reach the webhook. Cloudflare Pages serves the frontend only;
  # the SPA calls this service directly via API_BASE_URL.
  - type: web
    name: karna-background-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run render:worker
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

      # --- Remote Cloudflare D1 (database) ---
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_D1_API_TOKEN
        sync: false

      # --- Google OAuth + APIs (mirror Cloudflare Pages secrets) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false

      # --- Cloudflare R2 (document storage) — optional ---
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false

      # --- Cron (in-process scheduler via src/render/cron.ts) ---
      - key: RENDER_DISABLE_CRON
        value: "false"
      - key: CRON_SECRET
        sync: false
