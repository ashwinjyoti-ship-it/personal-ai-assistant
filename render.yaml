services:
  # Karna backend on Render.
  #
  # Two modes (toggled by RENDER_RUN_NATIVE_APP):
  #   - "false" (default): reverse-proxy /api/* to Cloudflare + native Telegram webhook.
  #   - "true"  (Phase A) : serve the ENTIRE Karna API natively against remote D1/R2.
  #
  # NOTE: this is a `web` service (public URL + inbound HTTP) so the Cloudflare
  # frontend and the Telegram Bot API can reach it. If your existing Render
  # service was created as a background `worker`, recreate it as a web service.
  - type: web
    name: karna-background-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run render:worker
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

      # --- Mode toggle ---
      # "true" runs the full Karna API natively on Render (Phase A, live).
      # NOTE: this service is blueprint-managed, so this value is re-applied on
      # every deploy — keep it "true" to stay in native mode. Set "false" to roll
      # back to the legacy Cloudflare proxy.
      - key: RENDER_RUN_NATIVE_APP
        value: "true"

      # --- Remote Cloudflare D1 (database) — required in native mode ---
      # Non-secret IDs can be set directly; the API token is a secret.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_D1_API_TOKEN
        sync: false

      # --- Google OAuth + APIs (mirror Cloudflare Pages secrets) ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false

      # --- Cloudflare R2 (document storage) — optional ---
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false

      # --- Cron (Phase C) ---
      # The native service runs an in-process scheduler every 60s (src/render/cron.ts),
      # replacing the separate Cloudflare cron worker. Set RENDER_DISABLE_CRON=true to
      # turn it off. CRON_SECRET is the shared secret for the cron endpoints (optional;
      # defaults to the legacy value if unset).
      - key: RENDER_DISABLE_CRON
        value: "false"
      - key: CRON_SECRET
        sync: false

      # --- Legacy proxy mode only (ignored when RENDER_RUN_NATIVE_APP=true) ---
      - key: RENDER_API_SECRET
        sync: false
      - key: LEGACY_API_BASE_URL
        sync: false
      - key: ASYNC_ACK_ROUTES
        value: "true"
