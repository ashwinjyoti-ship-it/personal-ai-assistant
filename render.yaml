services:
  - type: worker
    name: karna-background-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run render:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_API_SECRET
        sync: false
      - key: LEGACY_API_BASE_URL
        sync: false
      - key: ASYNC_ACK_ROUTES
        value: "true"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false
      - key: CLOUDFLARE_D1_API_TOKEN
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
